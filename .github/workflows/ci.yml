name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-mathlib-cache: true
          build-args: "--wfail"

      - name: Collect builtin code quality findings
        run: |
          mkdir -p reports
          lake --quiet lint --code-quality LeanVarieties > reports/code-quality.stream.json
          jq --slurp . reports/code-quality.stream.json > reports/code-quality.json

      - name: Upload code quality report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-code-quality
          path: reports/
          if-no-files-found: ignore
